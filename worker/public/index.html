<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>校园跑登录</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/login.js" type="module"></script>
</head>
<body>
  <main>
    <h1>校园跑登录</h1>
    <p>登录后，将账号绑定到发起链接的机器人用户。</p>
    <p id="status" role="status" aria-live="polite">正在读取登录链接…</p>
    <form id="login" hidden>
      <label for="username">校园账号</label>
      <input id="username" name="username" autocomplete="username" required maxlength="128">
      <label for="password">密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="128">
      <label for="captcha">图片验证码</label>
      <img id="captcha-image" alt="校园登录验证码">
      <input id="captcha" name="captcha" autocomplete="off" required maxlength="16">
      <button type="submit">登录并绑定</button>
      <p class="hint">请确认链接来自你本人发起的私聊。页面会将加密后的输入交给机器人完成学校登录。</p>
    </form>
  </main>
</body>
</html>
